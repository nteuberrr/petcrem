<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Alma Animal">
  <!-- Ícono de pestaña: la MISMA huella que usa el ítem «Clientes» del sidebar,
       o sea el icono `paw-print` de lucide (contorno: tres dedos + almohadilla),
       sobre el azul de marca. Antes había una huella sólida dibujada a mano que
       no calzaba con ninguna otra de la app; el dueño pidió unificarlas
       (2026-08-09).

       Va SIN HALO, igual que antes (decisión del dueño 2026-08-08): el halo
       dorado queda en el logo y el sello, porque a 16 px se leía como un rayón.

       El icono de lucide viene en una caja de 24×24 con trazo de 2. Acá se
       escala ×2,05 y se centra; el trazo escalado queda en ~4 px sobre 64, que
       es lo que lo hace legible cuando el navegador lo baja a 16 px. Si se
       cambia la escala, revisar que el trazo no adelgace: es lo primero que se
       pierde en tamaño pestaña. Regenerar el .ico con
       `npx tsx scripts/generar-favicon.ts`. -->
  <rect width="64" height="64" rx="14" fill="#143C64"/>
  <g transform="translate(7.4 7.4) scale(2.05)"
     fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="4" r="2"/>
    <circle cx="18" cy="8" r="2"/>
    <circle cx="20" cy="16" r="2"/>
    <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>
  </g>
</svg>
